name: Build and publish

# Every push builds the zip and checks it (download it from the run's Artifacts).
# Pushing a tag like v0.7.5 also uploads it to the Chrome Web Store and submits it for review.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_type:
        description: 'After review: go live (DEFAULT_PUBLISH), or wait for a manual publish (STAGED_PUBLISH)'
        type: choice
        options: [DEFAULT_PUBLISH, STAGED_PUBLISH]
        default: DEFAULT_PUBLISH
      submit:
        description: 'Upload and submit to the Chrome Web Store'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(jq -r .version extension/manifest.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $v"

      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version ${{ steps.ver.outputs.version }}. Raise the version in extension/manifest.json, commit, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check scripts parse
        run: |
          for f in $(find extension -name '*.js' -not -path '*/lib/*'); do node --check "$f"; done

      - name: Unit tests
        run: node --test tests/

      - name: Build zip (manifest at the zip root)
        run: |
          mkdir -p dist
          cd extension && zip -qr -X "../dist/75f-sequencer-copilot-v${{ steps.ver.outputs.version }}.zip" . -x '.*'
          cd .. && unzip -l dist/*.zip | grep -q ' manifest.json$'

      - uses: actions/upload-artifact@v4
        with:
          name: 75f-sequencer-copilot-v${{ steps.ver.outputs.version }}
          path: dist/*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.submit)
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 75f-sequencer-copilot-v${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Upload and submit for review
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TYPE: ${{ inputs.publish_type || vars.CWS_PUBLISH_TYPE || 'DEFAULT_PUBLISH' }}
        run: python scripts/cws_publish.py dist/*.zip
